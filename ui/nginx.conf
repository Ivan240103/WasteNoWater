server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; variables below make nginx resolve names lazily,
    # so the UI container starts even if a backend is not up yet.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $farm_backend http://farm-backend:8000;
        proxy_pass $farm_backend;
    }

    location /sim/ {
        set $simulator http://sensor-simulator:8001;
        rewrite ^/sim/(.*)$ /$1 break;
        proxy_pass $simulator;
    }

    location / {
        try_files $uri /index.html;
    }
}
